<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <!-- Traced from assets/img/bg-title.jpg. Two clusters tilted about -41deg:
       a small one in the top-left corner and the big signature cluster filling
       the bottom-right. Solid pills are drawn as round-capped lines; the
       outline-only pills are rounded rects with no fill. -->
  <g fill="none" stroke-linecap="round">

    <!-- ── top-left cluster ───────────────────────────────────── -->
    <line x1="-57.3" y1="248.7" x2="100.6" y2="76.7" stroke="#006633" stroke-width="72"/>
    <line x1="169.3" y1="139.5" x2="412.2" y2="-55.8" stroke="#FAFA00" stroke-width="69.5"/>
    <rect x="-94" y="245.7" width="267" height="34.5" rx="17.25"
          transform="rotate(-45 42.5 272.5)" stroke="#2E8B57" stroke-width="4.5"/>

    <!-- ── bottom-right cluster ───────────────────────────────── -->
    <!-- solid pills -->
    <line x1="1417.9" y1="1135.7" x2="1820.7" y2="794" stroke="#006633" stroke-width="72"/>
    <line x1="1726" y1="711.9" x2="1992.9" y2="486.6" stroke="#006633" stroke-width="72"/>
    <line x1="1746.2" y1="571.3" x2="1985.8" y2="370.8" stroke="#FAFA00" stroke-width="72"/>
    <line x1="1127.4" y1="1109.2" x2="1389.3" y2="892.9" stroke="#FAFA00" stroke-width="26.5"/>
    <line x1="1703.7" y1="1110.9" x2="1833.8" y2="1005.1" stroke="#FAFA00" stroke-width="28.5"/>
    <!-- the two pale pills cut off by the right-hand edge, untraced until Oct 2026 -->
    <line x1="1889" y1="714.3" x2="1990.8" y2="625.8" stroke="#FAFA00" stroke-width="72"/>
    <line x1="1892.8" y1="1018.3" x2="1990.8" y2="933.1" stroke="#FAFA00" stroke-width="72"/>

    <!-- outline-only pills -->
    <!-- Oct 2026: every shape in this file was re-measured against the
         photograph's own pixels (perpendicular profiles across each printed
         stroke) once the layer and the photo shared one box. The first outline
         was drawn ~4 units outside the printed line on every side, the long
         thin one was rotated ~2deg off and drawn with a 4-unit line where the
         print is 8, and the dashes were 22 wide and ~14 long where the print is
         21 and ~7 shorter. Positions are the printed line's centre.
         Then every shape was given a deliberate BLEED: solid pills 3 units
         wider, outlines 1.5 wider, all nudged 0.8 down-right. The printed
         edges are soft (JPEG, grain) and a trace drawn exactly on the centre
         of that soft edge left a 1–3px pale fringe outside it on a projector.
         Covering the edge by a hair reads as one shape. -->
    <rect x="1383.5" y="711.5" width="346" height="69" rx="34.5"
          transform="rotate(-40.5 1556.5 746)" stroke="#006633" stroke-width="7.5"/>
    <rect x="1758.5" y="830" width="293" height="70" rx="35"
          transform="rotate(-40 1903 865)" stroke="#006633" stroke-width="7.5"/>
    <rect x="1283.5" y="928" width="499.5" height="16.7" rx="8.35"
          transform="rotate(-40.3 1535 944.5)" stroke="#006633" stroke-width="9.5"/>

    <!-- short dashes that fill the gaps between the big pills -->
    <g stroke="#006633" stroke-width="24">
      <line x1="1348.1" y1="1026.5" x2="1372.5" y2="1006.3"/>
      <line x1="1449.7" y1="943" x2="1473.5" y2="922.6"/>
      <line x1="1568" y1="844.1" x2="1592.6" y2="822.4"/>
      <line x1="1706.6" y1="1022.3" x2="1730" y2="1002.3"/>
    </g>
  </g>
</svg>
