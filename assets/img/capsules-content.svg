<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <!-- Traced from assets/img/bg-content.jpg. On the content background the
       capsules are HORIZONTAL, not tilted: one green pill sitting behind and
       slightly outboard of one yellow pill, in the top-right and bottom-left.
       Each is drawn 3 units wider than the print and 0.8 lower: a deliberate
       bleed over the soft printed edge, which otherwise showed as a pale
       fringe (Oct 2026). -->
  <g fill="none" stroke-linecap="round">
    <!-- top-right: green behind and above, running off the right edge -->
    <line x1="1317.5" y1="18.8" x2="1975.5" y2="18.8"   stroke="#006633" stroke-width="65"/>
    <line x1="1353.5" y1="50.8" x2="1975.5" y2="50.8"   stroke="#FAFA00" stroke-width="54"/>
    <!-- bottom-left: green behind and below, running off the left edge -->
    <line x1="-54.5" y1="1097.8" x2="808.5" y2="1097.8" stroke="#006633" stroke-width="107"/>
    <line x1="-54.5" y1="1034.8" x2="786.5" y2="1034.8" stroke="#FAFA00" stroke-width="55"/>
  </g>
</svg>
